name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-smart-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0
      - run: python3 tool/apply_smart_editor.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/book_editor/presentation/pages/book_editor_page.dart
          git commit -m "Upgrade Markdown editor with live styling and slash commands"
          git push origin HEAD:feature/book-settings-chapters

  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Slang translations
        run: dart run slang
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build macOS debug app
        run: flutter build macos --debug
