name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-mdw-reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0

      - name: Patch recent-book validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/app/markweft_app.dart')
          text = path.read_text()
          old = '''  Future<void> _openRecentProject(String projectPath) async {
    final version = _recentProjectVersions[projectPath] ??
        await _recentProjectsStore.versionFor(projectPath);
    if (version != null && version != MdwVersionConverter.currentVersion) {
      await _convertBookVersion(
        sourcePath: projectPath,
        targetVersion: MdwVersionConverter.currentVersion,
      );
      return;
    }

    if (Platform.isMacOS) {
      final bookmark = await _recentProjectsStore.bookmarkFor(projectPath);
      if (bookmark == null) {
        setState(() => _errorMessage = t.welcome.errors.legacyBookmark);
        return;
      }

      try {
        final resolvedPath = await _bookmarkService.resolveBookmark(bookmark);
        _activeSecurityScopedPath = resolvedPath;
        await _runProjectAction(
          () => _projectRepository.openProject(resolvedPath),
          knownVersion: version,
          recentPath: projectPath,
        );
        return;
      } on Object catch (error) {
        if (!mounted) return;
        setState(() {
          _errorMessage = t.welcome.errors.bookmarkRestore(error: '$error');
        });
        return;
      }
    }

    await _runProjectAction(
      () => _projectRepository.openProject(projectPath),
      knownVersion: version,
    );
  }
'''
          new = '''  Future<void> _openRecentProject(String projectPath) async {
    if (Platform.isMacOS) {
      final bookmark = await _recentProjectsStore.bookmarkFor(projectPath);
      if (bookmark == null) {
        setState(() => _errorMessage = t.welcome.errors.legacyBookmark);
        return;
      }

      String? resolvedPath;
      try {
        resolvedPath = await _bookmarkService.resolveBookmark(bookmark);
        final actualVersion = await _versionConverter.inspectVersion(resolvedPath);
        await _recentProjectsStore.cacheVersion(projectPath, actualVersion);

        if (!mounted) {
          await _bookmarkService.stopAccessing(resolvedPath);
          return;
        }

        setState(() {
          _recentProjectVersions = <String, int?>{
            ..._recentProjectVersions,
            projectPath: actualVersion,
          };
        });

        if (actualVersion != MdwVersionConverter.currentVersion) {
          await _bookmarkService.stopAccessing(resolvedPath);
          resolvedPath = null;
          await _convertBookVersion(
            sourcePath: projectPath,
            targetVersion: MdwVersionConverter.currentVersion,
          );
          return;
        }

        _activeSecurityScopedPath = resolvedPath;
        await _runProjectAction(
          () => _projectRepository.openProject(resolvedPath!),
          knownVersion: actualVersion,
          recentPath: projectPath,
        );
        return;
      } on Object catch (error) {
        if (resolvedPath != null) {
          await _bookmarkService.stopAccessing(resolvedPath);
          if (_activeSecurityScopedPath == resolvedPath) {
            _activeSecurityScopedPath = null;
          }
        }
        if (!mounted) return;
        setState(() {
          _errorMessage = t.welcome.errors.bookmarkRestore(error: '$error');
        });
        return;
      }
    }

    try {
      final actualVersion = await _versionConverter.inspectVersion(projectPath);
      await _recentProjectsStore.cacheVersion(projectPath, actualVersion);

      if (!mounted) return;
      setState(() {
        _recentProjectVersions = <String, int?>{
          ..._recentProjectVersions,
          projectPath: actualVersion,
        };
      });

      if (actualVersion != MdwVersionConverter.currentVersion) {
        await _convertBookVersion(
          sourcePath: projectPath,
          targetVersion: MdwVersionConverter.currentVersion,
        );
        return;
      }

      await _runProjectAction(
        () => _projectRepository.openProject(projectPath),
        knownVersion: actualVersion,
      );
    } on Object catch (error) {
      if (!mounted) return;
      setState(() {
        _errorMessage = t.welcome.errors.openBook(error: '$error');
      });
    }
  }
'''
          if old not in text:
              raise SystemExit('recent-project method marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/markweft_app.dart
          git commit -m "Validate actual MDW version when reopening recent books" || exit 0
          git push origin HEAD:feature/book-settings-chapters

  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Slang translations
        run: dart run slang

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS debug app
        run: flutter build macos --debug
