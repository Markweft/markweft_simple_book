name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-editor-actions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/book-settings-chapters'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0

      - name: Remove duplicate editor actions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/book_editor/presentation/pages/book_editor_page.dart')
          text = path.read_text()
          original = text

          top_block = '''          IconButton(
            tooltip: tr.editor.sidebar.title,
            isSelected: _sidebarVisible,
            onPressed: () => setState(() => _sidebarVisible = !_sidebarVisible),
            icon: const Icon(Icons.view_sidebar_outlined),
            selectedIcon: const Icon(Icons.view_sidebar_rounded),
          ),
          if (_workspaceMode == BookWorkspaceMode.edit)
            IconButton(
              tooltip: tr.editor.workspace.modes.preview,
              isSelected: _previewVisible,
              onPressed: () => setState(() => _previewVisible = !_previewVisible),
              icon: const Icon(Icons.preview_outlined),
              selectedIcon: const Icon(Icons.preview_rounded),
            ),
          const SizedBox(width: 4),
'''
          text = text.replace(top_block, '', 1)

          secondary_top_block = '''          const SizedBox(width: 4),
          IconButton(
            tooltip: tr.editor.sidebar.history.title,
            onPressed: _saveStatus == SaveStatus.loading ? null : _openHistory,
            icon: const Icon(Icons.history_rounded),
          ),
          IconButton(
            tooltip: tr.editor.sidebar.settings.title,
            onPressed: _saveStatus == SaveStatus.loading || _settingsInProgress
                ? null
                : _showBookSettings,
            icon: const Icon(Icons.tune_rounded),
          ),
          IconButton(
            tooltip: tr.editor.sidebar.appSettings,
            onPressed: widget.onOpenAppSettings,
            icon: const Icon(Icons.settings_outlined),
          ),
'''
          text = text.replace(secondary_top_block, '          const SizedBox(width: 6),\n', 1)

          sidebar_actions = '''          _SidebarAction(
            icon: Icons.tune_outlined,
            title: tr.editor.sidebar.settings.title,
            subtitle: tr.editor.sidebar.settings.subtitle,
            onTap: onOpenSettings,
          ),
          _SidebarAction(
            icon: Icons.history_rounded,
            title: tr.editor.sidebar.history.title,
            subtitle: tr.editor.sidebar.history.subtitle,
            onTap: onOpenHistory,
          ),
          _SidebarAction(
            icon: Icons.settings_outlined,
            title: tr.editor.sidebar.appSettings,
            onTap: onOpenAppSettings,
          ),
          const SizedBox(height: 4),
          const Divider(height: 1),
'''
          text = text.replace(sidebar_actions, '          const Divider(height: 1),\n', 1)

          if text != original:
              path.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/book_editor/presentation/pages/book_editor_page.dart
          git commit -m "Simplify editor command surfaces"
          git push origin HEAD:feature/book-settings-chapters

  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Slang translations
        run: dart run slang

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS debug app
        run: flutter build macos --debug
