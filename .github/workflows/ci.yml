name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-mdw-atomic-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0

      - name: Patch atomic MDW persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('lib/features/book_library/data/repositories/mdw_book_project_repository.dart')
          text = repo.read_text()
          original = text

          import_marker = "import 'package:markweft_simple_book/features/book_library/data/services/mdw_version_converter.dart';\n"
          atomic_import = "import 'package:markweft_simple_book/features/book_library/data/services/mdw_atomic_file_service.dart';\n"
          if atomic_import not in text:
              text = text.replace(import_marker, atomic_import + import_marker, 1)

          class_marker = 'final class MdwBookProjectRepository implements BookProjectRepository {\n'
          field = '  static const MdwAtomicFileService _atomicFileService = MdwAtomicFileService();\n\n'
          if field not in text:
              text = text.replace(class_marker, class_marker + field, 1)

          text = text.replace(
              "  Future<MarkweftProject> openProject(String projectPath) async {\n    final projectFile = File(projectPath);\n",
              "  Future<MarkweftProject> openProject(String projectPath) async {\n    final projectFile = await _atomicFileService.recoverIfNeeded(File(projectPath));\n",
              1,
          )
          text = text.replace(
              '    final encoded = ZipEncoder().encode(archive);\n    await project.file.writeAsBytes(encoded, flush: true);\n',
              '    final encoded = ZipEncoder().encode(archive);\n    await _atomicFileService.write(project.file, encoded);\n',
              1,
          )
          if text != original:
              repo.write_text(text)

          converter = Path('lib/features/book_library/data/services/mdw_version_converter.dart')
          text = converter.read_text()
          original = text

          import_marker = "import 'package:file_selector/file_selector.dart';\n"
          atomic_import = "import 'package:markweft_simple_book/features/book_library/data/services/mdw_atomic_file_service.dart';\n"
          if atomic_import not in text:
              text = text.replace(import_marker, import_marker + atomic_import, 1)

          class_marker = 'final class MdwVersionConverter {\n  const MdwVersionConverter();\n\n'
          field = '  static const MdwAtomicFileService _atomicFileService = MdwAtomicFileService();\n\n'
          if field not in text:
              text = text.replace(class_marker, class_marker + field, 1)

          text = text.replace(
              '    final sourceFile = File(sourcePath);\n    final workspace = await _createWorkspace();\n',
              '    final sourceFile = await _atomicFileService.recoverIfNeeded(File(sourcePath));\n    final workspace = await _createWorkspace();\n',
              1,
          )
          text = text.replace(
              '    try {\n      await _extract(File(projectPath), workspace);\n      return _readVersion(workspace);\n',
              '    try {\n      final projectFile = await _atomicFileService.recoverIfNeeded(File(projectPath));\n      await _extract(projectFile, workspace);\n      return _readVersion(workspace);\n',
              1,
          )
          if text != original:
              converter.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/book_library/data/repositories/mdw_book_project_repository.dart \
                  lib/features/book_library/data/services/mdw_version_converter.dart \
                  lib/features/book_library/data/services/mdw_atomic_file_service.dart
          git commit -m "Fix MDW corruption on abrupt app exit"
          git push origin HEAD:feature/book-settings-chapters

  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Slang translations
        run: dart run slang

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS debug app
        run: flutter build macos --debug
