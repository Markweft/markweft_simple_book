name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-smart-markdown-editor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/book-settings-chapters'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0

      - name: Patch editor surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/book_editor/presentation/pages/book_editor_page.dart')
          text = path.read_text()
          original = text

          old_import = "import 'package:markweft_simple_book/features/book_editor/presentation/widgets/markdown_command_toolbar.dart';\n"
          new_import = "import 'package:markweft_simple_book/features/book_editor/presentation/widgets/smart_markdown_editor.dart';\n"
          if new_import not in text:
              text = text.replace(old_import, old_import + new_import, 1)

          text = text.replace(
              '  late final TextEditingController _controller;\n',
              '  late final SmartMarkdownController _controller;\n',
              1,
          )
          text = text.replace(
              '    _controller = TextEditingController();\n',
              '    _controller = SmartMarkdownController();\n',
              1,
          )

          start_marker = 'final class _MarkdownEditor extends StatelessWidget {'
          end_marker = 'final class _BookSidebar extends StatelessWidget {'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Markdown editor block markers not found')

          replacement = '''final class _MarkdownEditor extends StatelessWidget {
  const _MarkdownEditor({
    required this.controller,
    required this.chapterTitle,
    required this.actions,
    required this.onChanged,
  });

  final SmartMarkdownController controller;
  final String? chapterTitle;
  final Set<TemplateToolbarAction> actions;
  final ValueChanged<String> onChanged;

  @override
  Widget build(BuildContext context) {
    final tr = Translations.of(context);
    final scheme = Theme.of(context).colorScheme;
    return Material(
      color: scheme.surface,
      child: Padding(
        padding: const EdgeInsets.fromLTRB(14, 10, 14, 14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              children: [
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        chapterTitle == null
                            ? tr.editor.workspace.markdown.title
                            : tr.editor.workspace.markdown
                                .chapterTitle(title: chapterTitle!),
                        style: Theme.of(context).textTheme.titleMedium,
                        overflow: TextOverflow.ellipsis,
                      ),
                      const SizedBox(height: 2),
                      Text(
                        'Live Markdown · Select text for formatting · Type / for blocks',
                        style: Theme.of(context).textTheme.labelSmall?.copyWith(
                              color: scheme.onSurfaceVariant,
                            ),
                      ),
                    ],
                  ),
                ),
                Tooltip(
                  message: tr.editor.workspace.markdown.chapterOnlyLoaded,
                  child: Container(
                    padding: const EdgeInsets.symmetric(
                      horizontal: 8,
                      vertical: 5,
                    ),
                    decoration: BoxDecoration(
                      color: scheme.primaryContainer.withValues(alpha: 0.45),
                      borderRadius: BorderRadius.circular(8),
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Icon(
                          Icons.bolt_rounded,
                          size: 15,
                          color: scheme.primary,
                        ),
                        const SizedBox(width: 4),
                        Text(
                          'Live',
                          style: Theme.of(context).textTheme.labelSmall?.copyWith(
                                color: scheme.primary,
                                fontWeight: FontWeight.w700,
                              ),
                        ),
                      ],
                    ),
                  ),
                ),
              ],
            ),
            const SizedBox(height: 10),
            Expanded(
              child: SmartMarkdownEditor(
                controller: controller,
                actions: actions,
                onChanged: onChanged,
                hintText: tr.editor.workspace.markdown.writeHint,
              ),
            ),
          ],
        ),
      ),
    );
  }
}

'''
          if 'final SmartMarkdownController controller;' not in text[start:end]:
              text = text[:start] + replacement + text[end:]

          if text != original:
              path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/book_editor/presentation/pages/book_editor_page.dart
          git commit -m "Upgrade Markdown editor with live styling and slash commands"
          git push origin HEAD:feature/book-settings-chapters

  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Slang translations
        run: dart run slang

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS debug app
        run: flutter build macos --debug
