name: Cleanup branches

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main and develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" --jq '.[].ref' |
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"

            case "$branch" in
              main|develop)
                echo "Keeping $branch"
                ;;
              *)
                echo "Deleting $branch"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref#refs/}"
                ;;
            esac
          done

          unexpected="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" --jq '.[].ref' |
            sed 's#^refs/heads/##' |
            grep -Ev '^(main|develop)$' || true
          )"

          if [ -n "$unexpected" ]; then
            echo "Unexpected branches remain:"
            echo "$unexpected"
            exit 1
          fi
