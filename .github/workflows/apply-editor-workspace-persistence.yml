name: Apply editor workspace persistence

on:
  push:
    branches:
      - feature/book-settings-chapters
    paths:
      - .github/workflows/apply-editor-workspace-persistence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/book-settings-chapters
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Patch editor workspace persistence
        shell: python
        run: |
          from pathlib import Path

          file = Path('lib/features/book_editor/presentation/pages/book_editor_page.dart')
          text = file.read_text()

          def replace(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected source block was not found:\n{old[:240]}')
              text = text.replace(old, new, 1)

          replace(
              "import 'package:markweft_simple_book/features/book_editor/application/book_export_service.dart';\n",
              "import 'package:markweft_simple_book/features/book_editor/application/book_export_service.dart';\n"
              "import 'package:markweft_simple_book/features/book_editor/data/services/editor_workspace_state_store.dart';\n",
          )

          replace(
              "  static const BookHistoryService _historyService = BookHistoryService();\n",
              "  static const BookHistoryService _historyService = BookHistoryService();\n"
              "  static const EditorWorkspaceStateStore _workspaceStateStore =\n"
              "      EditorWorkspaceStateStore();\n",
          )

          replace(
              "  Timer? _projectFlushDebounce;\n",
              "  Timer? _projectFlushDebounce;\n"
              "  Timer? _workspaceSaveDebounce;\n",
          )

          replace(
              "  void dispose() {\n"
              "    _saveDebounce?.cancel();\n"
              "    _previewDebounce?.cancel();\n"
              "    _projectFlushDebounce?.cancel();\n"
              "    _controller.dispose();\n"
              "    super.dispose();\n"
              "  }\n",
              "  void dispose() {\n"
              "    _saveDebounce?.cancel();\n"
              "    _previewDebounce?.cancel();\n"
              "    _projectFlushDebounce?.cancel();\n"
              "    _workspaceSaveDebounce?.cancel();\n"
              "    unawaited(_persistWorkspaceState());\n"
              "    _controller.dispose();\n"
              "    super.dispose();\n"
              "  }\n",
          )

          replace(
              "      final first = chapters.first;\n"
              "      final markdown = await widget.projectRepository.loadChapterMarkdown(\n"
              "        widget.project,\n"
              "        first,\n"
              "      );\n"
              "      if (!mounted) return;\n\n"
              "      _controller.value = TextEditingValue(\n"
              "        text: markdown,\n"
              "        selection: const TextSelection.collapsed(offset: 0),\n"
              "      );\n"
              "      setState(() {\n"
              "        _bookSettings = settings;\n"
              "        _chapters = chapters;\n"
              "        _activeChapter = first;\n"
              "        _openChapterIds\n"
              "          ..clear()\n"
              "          ..add(first.id);\n"
              "        _setLoadedMarkdown(markdown);\n"
              "        _saveStatus = SaveStatus.saved;\n"
              "        _errorMessage = null;\n"
              "      });\n",
              "      final workspace =\n"
              "          await _workspaceStateStore.load(widget.project.file.path);\n"
              "      final chapterIds = chapters.map((chapter) => chapter.id).toSet();\n"
              "      final restoredOpenIds = workspace?.openChapterIds\n"
              "              .where(chapterIds.contains)\n"
              "              .toList(growable: false) ??\n"
              "          const <String>[];\n"
              "      final restoredActiveId = workspace?.activeChapterId;\n"
              "      final active = chapters.where(\n"
              "        (chapter) => chapter.id == restoredActiveId,\n"
              "      ).firstOrNull ??\n"
              "          chapters.first;\n"
              "      final markdown = await widget.projectRepository.loadChapterMarkdown(\n"
              "        widget.project,\n"
              "        active,\n"
              "      );\n"
              "      if (!mounted) return;\n\n"
              "      _controller.value = TextEditingValue(\n"
              "        text: markdown,\n"
              "        selection: const TextSelection.collapsed(offset: 0),\n"
              "      );\n"
              "      setState(() {\n"
              "        _bookSettings = settings;\n"
              "        _chapters = chapters;\n"
              "        _activeChapter = active;\n"
              "        _openChapterIds\n"
              "          ..clear()\n"
              "          ..addAll(restoredOpenIds.isEmpty ? <String>[active.id] : restoredOpenIds);\n"
              "        if (!_openChapterIds.contains(active.id)) {\n"
              "          _openChapterIds.add(active.id);\n"
              "        }\n"
              "        _sidebarVisible = workspace?.sidebarVisible ?? true;\n"
              "        _previewVisible = workspace?.previewVisible ?? true;\n"
              "        _sidebarWidth =\n"
              "            (workspace?.sidebarWidth ?? 286).clamp(220.0, 520.0);\n"
              "        _previewWidth =\n"
              "            (workspace?.previewWidth ?? 520).clamp(320.0, 900.0);\n"
              "        _workspaceMode = BookWorkspaceMode.values.where(\n"
              "              (mode) => mode.name == workspace?.workspaceMode,\n"
              "            ).firstOrNull ??\n"
              "            BookWorkspaceMode.edit;\n"
              "        _setLoadedMarkdown(markdown);\n"
              "        _saveStatus = SaveStatus.saved;\n"
              "        _errorMessage = null;\n"
              "      });\n",
          )

          marker = "  void _setLoadedMarkdown(String markdown) {\n"
          insert = """  EditorWorkspaceState get _workspaceState => EditorWorkspaceState(
    sidebarVisible: _sidebarVisible,
    previewVisible: _previewVisible,
    sidebarWidth: _sidebarWidth,
    previewWidth: _previewWidth,
    workspaceMode: _workspaceMode.name,
    openChapterIds: List<String>.unmodifiable(_openChapterIds),
    activeChapterId: _activeChapter?.id,
  );

  void _scheduleWorkspaceSave() {
    _workspaceSaveDebounce?.cancel();
    _workspaceSaveDebounce = Timer(
      const Duration(milliseconds: 350),
      () => unawaited(_persistWorkspaceState()),
    );
  }

  Future<void> _persistWorkspaceState() {
    return _workspaceStateStore.save(
      widget.project.file.path,
      _workspaceState,
    );
  }

  void _setSidebarVisible(bool value) {
    if (_sidebarVisible == value) return;
    setState(() => _sidebarVisible = value);
    _scheduleWorkspaceSave();
  }

  void _setPreviewVisible(bool value) {
    if (_previewVisible == value) return;
    setState(() => _previewVisible = value);
    _scheduleWorkspaceSave();
  }

  void _toggleSidebar() => _setSidebarVisible(!_sidebarVisible);

  void _togglePreview() {
    setState(() {
      _previewVisible = !_previewVisible;
      if (_previewVisible && _workspaceMode == BookWorkspaceMode.preview) {
        _workspaceMode = BookWorkspaceMode.edit;
      }
    });
    _scheduleWorkspaceSave();
  }

  void _setWorkspaceMode(BookWorkspaceMode mode) {
    setState(() {
      _workspaceMode = mode;
      if (mode == BookWorkspaceMode.preview) {
        _previewVisible = true;
      }
    });
    _scheduleWorkspaceSave();
  }

"""
          if marker not in text:
              raise SystemExit('Workspace method insertion point not found')
          text = text.replace(marker, insert + marker, 1)

          select_block = """        _saveStatus = SaveStatus.saved;
        _errorMessage = null;
      });
    } on Object catch (error) {
"""
          select_replacement = """        _saveStatus = SaveStatus.saved;
        _errorMessage = null;
      });
      _scheduleWorkspaceSave();
    } on Object catch (error) {
"""
          # Replace the second matching save-success block, which belongs to chapter selection.
          first = text.find(select_block)
          second = text.find(select_block, first + 1)
          if second < 0:
              raise SystemExit('Chapter selection persistence point not found')
          text = text[:second] + select_replacement + text[second + len(select_block):]

          replace(
              "        _openChapterIds.remove(chapter.id);\n"
              "        await _selectChapter(fallback);\n",
              "        _openChapterIds.remove(chapter.id);\n"
              "        _scheduleWorkspaceSave();\n"
              "        await _selectChapter(fallback);\n",
          )

          replace(
              "    setState(() => _openChapterIds.remove(chapter.id));\n",
              "    setState(() => _openChapterIds.remove(chapter.id));\n"
              "    _scheduleWorkspaceSave();\n",
          )

          replace(
              "    _openChapterIds.removeWhere(deletedIds.contains);\n\n"
              "    await widget.projectRepository.deleteChapterTree(widget.project, chapter);\n",
              "    _openChapterIds.removeWhere(deletedIds.contains);\n"
              "    _scheduleWorkspaceSave();\n\n"
              "    await widget.projectRepository.deleteChapterTree(widget.project, chapter);\n",
          )

          replace(
              "  void _resizeSidebar(double delta) {\n"
              "    setState(() {\n"
              "      _sidebarWidth = (_sidebarWidth + delta).clamp(220.0, 520.0);\n"
              "    });\n"
              "  }\n\n"
              "  void _resizePreview(double delta) {\n"
              "    setState(() {\n"
              "      _previewWidth = (_previewWidth - delta).clamp(320.0, 900.0);\n"
              "    });\n"
              "  }\n",
              "  void _resizeSidebar(double delta) {\n"
              "    setState(() {\n"
              "      _sidebarWidth = (_sidebarWidth + delta).clamp(220.0, 520.0);\n"
              "    });\n"
              "    _scheduleWorkspaceSave();\n"
              "  }\n\n"
              "  void _resizePreview(double delta) {\n"
              "    setState(() {\n"
              "      _previewWidth = (_previewWidth - delta).clamp(320.0, 900.0);\n"
              "    });\n"
              "    _scheduleWorkspaceSave();\n"
              "  }\n",
          )

          replace(
              "    await _saveNow();\n"
              "    if (!mounted || _saveStatus == SaveStatus.failed) return;\n"
              "    await widget.onClose();\n",
              "    await _saveNow();\n"
              "    if (!mounted || _saveStatus == SaveStatus.failed) return;\n"
              "    _workspaceSaveDebounce?.cancel();\n"
              "    await _persistWorkspaceState();\n"
              "    await widget.onClose();\n",
          )

          text = text.replace(
              "onPressed: () => setState(() => _sidebarVisible = !_sidebarVisible),",
              "onPressed: _toggleSidebar,",
          )
          text = text.replace(
              "onPressed: () => setState(() => _previewVisible = !_previewVisible),",
              "onPressed: _togglePreview,",
          )
          text = text.replace(
              "onSelectionChanged: (selection) {\n"
              "              setState(() {\n"
              "                _workspaceMode = selection.first;\n"
              "                if (_workspaceMode == BookWorkspaceMode.preview) {\n"
              "                  _previewVisible = true;\n"
              "                }\n"
              "              });\n"
              "            },",
              "onSelectionChanged: (selection) => _setWorkspaceMode(selection.first),",
          )
          text = text.replace(
              "onClose: () => setState(() => _sidebarVisible = false),",
              "onClose: () => _setSidebarVisible(false),",
          )
          text = text.replace(
              "? () => setState(() => _previewVisible = false)",
              "? () => _setPreviewVisible(false)",
          )
          text = text.replace(
              "onToggleSidebar: () =>\n                                setState(() => _sidebarVisible = !_sidebarVisible),",
              "onToggleSidebar: _toggleSidebar,",
          )
          text = text.replace(
              "onTogglePreview: () => setState(() {\n"
              "                              _previewVisible = !_previewVisible;\n"
              "                              if (_previewVisible &&\n"
              "                                  _workspaceMode == BookWorkspaceMode.preview) {\n"
              "                                _workspaceMode = BookWorkspaceMode.edit;\n"
              "                              }\n"
              "                            }),",
              "onTogglePreview: _togglePreview,",
          )

          file.write_text(text)

      - name: Format
        run: dart format lib/features/book_editor/presentation/pages/book_editor_page.dart lib/features/book_editor/data/services/editor_workspace_state_store.dart test/editor_workspace_state_store_test.dart

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-editor-workspace-persistence.yml

      - name: Commit generated integration
        run: |
          git config user.name "Markweft Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/features/book_editor/presentation/pages/book_editor_page.dart \
                  lib/features/book_editor/data/services/editor_workspace_state_store.dart \
                  test/editor_workspace_state_store_test.dart \
                  .github/workflows/apply-editor-workspace-persistence.yml
          git commit -m "Persist editor workspace per book"
          git push origin HEAD:feature/book-settings-chapters
