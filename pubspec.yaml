name: markweft_simple_book
description: A local-first Markdown book editor using compressed .mdw projects.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localization.
  # Keep Flutter delegates for Material/Cupertino/Widgets localization.
  flutter_localizations:
    sdk: flutter
  # Slang uses intl for dates, numbers, plurals, and formatting.
  intl: ^0.20.2
  # Optional but useful for showing localized locale names in settings.
  flutter_localized_locales: ^2.0.5
  # Type-safe JSON localization generator/runtime.
  slang: ^4.14.0
  slang_flutter: ^4.14.0


  archive: ^4.0.7
  file_selector: ^1.0.3
  markdown_widget: ^2.3.2+8
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  yaml: ^3.1.3

  markweft_template_simple:
    path: ../markweft_template_simple
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
