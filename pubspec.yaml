name: markweft_simple_book
description: A local-first Markdown book editor using compressed .mdw projects.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  flutter_localized_locales: ^2.0.5
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  archive: ^4.0.7
  crypto: ^3.0.6
  file_selector: ^1.0.3
  markdown_widget: ^2.3.2+8
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  yaml: ^3.1.3

  # Keep the editor feature branch and template feature branch in sync.
  # This avoids resolving the local template's main branch, which does not
  # expose BookSettings/BookChapter APIs yet.
  markweft_template_simple:
    git:
      url: https://github.com/Markweft/markweft_template_simple.git
      ref: feature/book-settings-chapters

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
